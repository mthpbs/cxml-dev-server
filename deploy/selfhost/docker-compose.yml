# cXML Dev Server - self-hosted stack: app + Caddy (automatic HTTPS) + SQLite backups.
#
#   cp .env.example .env          # then edit: DOMAIN, ACME_EMAIL, ADMIN_PASSWORD_HASH, ...
#   docker compose up -d                                 # first start: pulls the published image (IMAGE); if it cannot be pulled, builds it from this repository
#   docker compose pull app caddy && docker compose up -d   # upgrade (a bare "docker compose pull" fails: the backup image is built locally)
#   docker compose up -d --build                         # always build the images from this repository instead
#   docker compose run --rm backup once                  # take a backup right now
#   docker compose logs -f app caddy                     # follow the logs
#
# Run these commands inside deploy/selfhost (that is where .env is read from).
# The local-development compose file in the repository root is unrelated to this one.
#
# Only Caddy is reachable from outside (ports 80/443). The app listens on 8080 inside the private "cxml" network.
# The app trusts X-Forwarded-For/-Proto from any peer (ASPNETCORE_FORWARDEDHEADERS_ENABLED), which is safe only
# because nothing but Caddy can reach it. Never publish the app's port 8080 directly.
#
# Escaping: ADMIN_PASSWORD_HASH from `hash-password` is base64 and contains no "$". Should you ever use a value with a
# "$", put it in single quotes in .env ('...') or compose will treat "$..." as a variable reference.

name: cxml-dev-server

services:
  app:
    image: ${IMAGE:-ghcr.io/mthpbs/cxml-dev-server:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # ConnectionStrings__Default, DataProtection__KeysPath and ASPNETCORE_URLS keep the image defaults
      # (/app/data/cxml-dev.db, /app/data/keys, port 8080); /app/data is the cxml-data volume.
      Admin__Enabled: "true"
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__PasswordHash: "${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env (create it with: docker run --rm -it <image> hash-password)}"
      Cxml__PublicBaseUrl: "${CXML_PUBLIC_BASE_URL:-https://${DOMAIN:?Set DOMAIN in .env}}"
      Cxml__AllowUnknownPartners: ${CXML_ALLOW_UNKNOWN_PARTNERS:-false}
      Cxml__SeedDemoPartners: ${CXML_SEED_DEMO_PARTNERS:-false}
    volumes:
      - cxml-data:/app/data
    networks:
      - cxml
    healthcheck:
      # The image has no curl/wget: the app binary doubles as the health checker (exit code 0 = healthy).
      test: ["CMD", "dotnet", "CxmlDevServer.Web.dll", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # HTTP_PORT / HTTPS_PORT exist for testing on a host where 80/443 are taken. Public certificates (TLS_MODE=acme)
      # require 80 and 443; with other ports also set CXML_PUBLIC_BASE_URL to include the port.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env}"
      TLS_MODE: ${TLS_MODE:-acme}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and the local CA: keep it, or certificates are re-issued (rate limits!)
      - caddy_config:/config
    networks:
      - cxml

  backup:
    build: ./backup
    image: cxml-dev-server-backup:local
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Read-write on purpose: SQLite in WAL mode must be able to open the -shm file, even for reading.
      - cxml-data:/data
      # Backups land in deploy/selfhost/backups (created by Docker, owned by uid 1654 once the first backup runs).
      - ./backups:/backups
    network_mode: none # needs no network at all

networks:
  cxml:
    # A private bridge network. Not "internal": the app may call buyer systems (sender page) and Caddy needs the
    # internet for certificates.
    driver: bridge

volumes:
  cxml-data:
  caddy_data:
  caddy_config:
