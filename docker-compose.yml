# docker compose up --build   ->   http://localhost:8080
services:
  cxml-dev-server:
    build: .
    image: cxml-dev-server
    ports:
      - "8080:8080"
    environment:
      # Externally visible URL; needed when the server is reached through a proxy or tunnel,
      # otherwise the StartPage URL is derived from the incoming request.
      # Cxml__PublicBaseUrl: "https://dev.example.com"
      Cxml__AllowUnknownPartners: "false"
    volumes:
      - cxml-data:/app/data
    restart: unless-stopped

volumes:
  cxml-data:
