# Builds the image, publishes it to GHCR and deploys it to Azure Container Apps with deploy/azure/main.bicep.
#
# Trigger: manually only (Actions > Deploy to Azure Container Apps > Run workflow) with a GitHub environment name and
# optionally an existing image tag. Images are published by release-image.yml (semver and latest on "v*" tags, edge on
# main): pick an existing tag to deploy it without building, or leave it empty to build the selected ref as sha-xxxxxxx.
#
# Required in the GitHub environment (or repository) - Settings > Secrets and variables > Actions:
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   Entra app with a federated credential for this
#                                                                          repository/environment (OIDC, no stored password)
#              ADMIN_PASSWORD_HASH                                         output of: docker run --rm -it <image> hash-password
#   variables: AZURE_RESOURCE_GROUP                                        existing resource group to deploy into
# Optional:
#   secrets:   GHCR_PULL_TOKEN                                             PAT with read:packages; only if the GHCR package is private
#   variables: AZURE_LOCATION, AZURE_PUBLIC_BASE_URL, AZURE_EXISTING_ENVIRONMENT_ID, AZURE_CUSTOM_DOMAINS_JSON
# All other parameters are in deploy/azure/main.bicepparam (it names main.bicep itself via its "using" line).
# The smoke test runs on a GitHub-hosted runner: with an ipAllowList in main.bicepparam it gets 403 and the job fails.
name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to (holds the Azure secrets and variables)
        type: string
        default: production
        required: true
      image_tag:
        description: Existing image tag in GHCR to deploy (empty - build and push the selected ref first)
        type: string
        required: false

permissions:
  contents: read

# One deployment per environment at a time; a running deployment is never cancelled half-way.
concurrency:
  group: deploy-aca-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE_NAME: cxml-dev-server

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Resolve image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          # GHCR repository names must be lowercase.
          repository="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            build=false
          else
            tag="sha-${GITHUB_SHA::7}"
            build=true
          fi
          {
            echo "repository=$repository"
            echo "tag=$tag"
            echo "build=$build"
            echo "image=$repository:$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.ref.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.ref.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.ref.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: steps.ref.outputs.build == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.repository }}
          tags: |
            type=sha,prefix=sha-

      - name: Build and push
        if: steps.ref.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Values reach main.bicepparam through environment variables (readEnvironmentVariable), so no secret ever
      # appears on a command line. A missing ADMIN_PASSWORD_HASH fails the deployment before the app is created.
      - name: Deploy Bicep template
        id: deploy
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_IMAGE: ${{ needs.image.outputs.image }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          REGISTRY_SERVER: ghcr.io
          REGISTRY_USERNAME: ${{ github.repository_owner }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          PUBLIC_BASE_URL: ${{ vars.AZURE_PUBLIC_BASE_URL }}
          EXISTING_ENVIRONMENT_ID: ${{ vars.AZURE_EXISTING_ENVIRONMENT_ID }}
          CUSTOM_DOMAINS_JSON: ${{ vars.AZURE_CUSTOM_DOMAINS_JSON || '[]' }}
        run: |
          set -euo pipefail
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Set the repository/environment variable AZURE_RESOURCE_GROUP."
            exit 1
          fi
          if [ -z "$ADMIN_PASSWORD_HASH" ]; then
            echo "::error::Set the secret ADMIN_PASSWORD_HASH (docker run --rm -it <image> hash-password)."
            exit 1
          fi
          echo "Deploying $CONTAINER_IMAGE to resource group $RESOURCE_GROUP"
          url="$(az deployment group create \
            --name "cxml-dev-server-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters deploy/azure/main.bicepparam \
            --query properties.outputs.url.value --output tsv)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          # A new revision needs a moment to pull the image and start; retry on connection errors and 5xx.
          curl_retry=(--fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 20)
          echo "GET $APP_URL/health"
          curl "${curl_retry[@]}" "$APP_URL/health"; echo
          echo "GET $APP_URL/cxml"
          curl "${curl_retry[@]}" --output /dev/null --write-out '%{http_code}\n' "$APP_URL/cxml"
          {
            echo "### Deployed"
            echo "- URL: $APP_URL"
            echo "- cXML endpoint: $APP_URL/cxml"
            echo "- Image: \`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
